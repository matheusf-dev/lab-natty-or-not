<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo HTML semântico</title>
</head>
<body>
  <header><h1>Diário de estudos</h1><nav aria-label="Principal"><a href="#trilha">Minha trilha</a></nav></header>
  <main id="trilha">
    <section><h2>Habilidades</h2><ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul></section>
    <section><h2>Formulário de demonstração</h2>
      <form><label for="nome">Nome</label> <input id="nome" name="nome" required>
      <label for="email">E-mail</label> <input id="email" name="email" type="email" required>
      <button type="submit">Validar</button></form>
      <p id="feedback" role="status"></p>
    </section>
  </main>
  <footer>Exemplo educacional, sem envio de dados.</footer>
  <script>
    // Impede o envio: apenas demonstra a validação nativa.
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault();
      document.querySelector('#feedback').textContent = 'Campos válidos!';
    });
  </script>
</body>
</html>
